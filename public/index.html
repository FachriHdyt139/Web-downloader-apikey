<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACHRI DEV Downloader - Ultimate</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff4b2b">
    <style>
        :root {
            /* Tema Gelap (Default) */
            --bg-color: #0f0c29; --bg-gradient: radial-gradient(circle at top left, #302b63, #0f0c29);
            --card-bg: rgba(30, 30, 50, 0.6); --text: #ffffff; --text-muted: #a0a0a0;
            --primary: #ff4b2b; --secondary: #ff416c; --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0,0,0,0.4); --history-bg: rgba(0,0,0,0.3);
        }
        body.light-mode {
            /* Tema Terang */
            --bg-gradient: radial-gradient(circle at top left, #e0eafc, #cfdef3);
            --card-bg: rgba(255, 255, 255, 0.85); --text: #1a1a2e; --text-muted: #555555;
            --glass-border: 1px solid rgba(0, 0, 0, 0.05); --input-bg: rgba(255,255,255,0.8); --history-bg: rgba(0,0,0,0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-gradient); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        
        .container { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: var(--glass-border); text-align: center; position: relative; overflow: hidden; }
        
        /* Theme Toggle Button */
        .theme-toggle { position: absolute; top: 20px; right: 20px; background: var(--input-bg); border: var(--glass-border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 10; }
        .theme-toggle:hover { transform: scale(1.1); }

        .profile-pic { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: white; border: 3px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(255, 75, 43, 0.4); }
        h1 { font-size: 20px; margin-bottom: 5px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 15px; }
        .stats { font-size: 12px; color: var(--secondary); margin-bottom: 25px; font-weight: 600; background: var(--input-bg); display: inline-block; padding: 5px 12px; border-radius: 20px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: var(--input-bg); padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 4px 15px rgba(255,75,43,0.3); }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; margin-left: 5px; font-weight: 600; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        input[type="text"] { width: 100%; padding: 15px 50px 15px 15px; border-radius: 12px; border: var(--glass-border); background: var(--input-bg); color: var(--text); outline: none; font-size: 13px; }
        input[type="text"]:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(255,65,108,0.2); }
        .btn-paste { position: absolute; right: 8px; background: rgba(128,128,128,0.2); border: none; color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }

        .btn-download { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(255, 75, 43, 0.4); position: relative; overflow: hidden; }
        .btn-download:active { transform: scale(0.97); }
        .btn-download:disabled { opacity: 0.7; cursor: not-allowed; }

        .progress-container { width: 100%; height: 6px; background: var(--input-bg); border-radius: 10px; margin-top: 15px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary), #ff8a00); border-radius: 10px; transition: width 0.4s ease; position: relative; }
        .progress-bar::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: translateX(-100%); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .progress-text { font-size: 11px; color: var(--secondary); margin-top: 8px; display: none; font-weight: 600; }

        .result-area { margin-top: 20px; padding: 15px; background: var(--history-bg); border-radius: 16px; border: var(--glass-border); display: none; text-align: left; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-info { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .result-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #222; }
        .result-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-save { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 13px; }

        /* History Section */
        .history-section { margin-top: 25px; text-align: left; display: none; }
        .history-title { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .clear-history { background: none; border: none; color: #ff6b6b; font-size: 10px; cursor: pointer; }
        .history-list { list-style: none; max-height: 150px; overflow-y: auto; }
        .history-item { background: var(--input-bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; border: var(--glass-border); }
        .history-item a { color: var(--secondary); text-decoration: none; font-weight: bold; }

        .footer-watermark { margin-top: 25px; font-size: 10px; color: var(--text-muted); opacity: 0.6; }
        .error-msg { color: #ff6b6b; font-size: 11px; margin-top: 10px; display: none; background: rgba(255,107,107,0.1); padding: 8px; border-radius: 8px; }
        
        /* PWA Install Prompt */
        #installPrompt { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card-bg); backdrop-filter: blur(10px); border: var(--glass-border); padding: 15px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; align-items: center; gap: 15px; z-index: 100; animation: slideUp 0.5s ease; }
        #installPrompt button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- PWA Install Banner -->
    <div id="installPrompt">
        <span style="font-size: 13px; font-weight: 600;">📱 Install Aplikasi FD?</span>
        <button id="btnInstall">Install</button>
        <button onclick="document.getElementById('installPrompt').style.display='none'" style="background:transparent; color:var(--text-muted); border:none; cursor:pointer;">✕</button>
    </div>

    <div class="container">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        <div class="profile-pic">FD</div>
        <h1>Media Downloader</h1>
        <p class="subtitle">Enterprise High-Speed Media Downloader</p>
        <p class="stats">🔥 Unduhan Hari Ini: <span id="dailyCount">0</span></p>

        <div class="tabs">
            <button class="tab-btn active" id="tabYt" onclick="switchTab('youtube')">YouTube MP3</button>
            <button class="tab-btn" id="tabTt" onclick="switchTab('tiktok')">TikTok Video</button>
        </div>

        <div class="input-group">
            <label id="inputLabel">Tempel Link (Auto-Detect Aktif):</label>
            <div class="input-wrapper">
                <input type="text" id="urlInput" placeholder="Paste link YouTube atau TikTok di sini..." oninput="autoDetect(this.value)">
                <button class="btn-paste" onclick="pasteClipboard()">📋 Paste</button>
            </div>
        </div>

        <button class="btn-download" id="actionBtn" onclick="processDownload()">🚀 Unduh Sekarang</button>
        
        <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">Menghubungkan ke server...</div>
        <div class="error-msg" id="errorMsg"></div>

        <div class="result-area" id="resultArea">
            <div class="result-info">
                <img src="" alt="Thumb" class="result-thumb" id="resThumb">
                <div><div style="font-size: 9px; color: var(--text-muted); margin-bottom: 2px;">JUDUL BERSIH (AI):</div><div class="result-title" id="resTitle">-</div></div>
            </div>
            <a href="#" class="btn-save" id="resLink" target="_blank">⬇ Simpan ke Perangkat</a>
        </div>

        <!-- Riwayat Download -->
        <div class="history-section" id="historySection">
            <div class="history-title">📜 Riwayat Terbaru <button class="clear-history" onclick="clearHistory()">Hapus</button></div>
            <ul class="history-list" id="historyList"></ul>
        </div>

        <div class="footer-watermark">Made with ❤️ by FACHRI DEV | v3.0 Ultimate</div>
    </div>

    <script>
        let currentMode = 'youtube';

        // --- 1. DARK/LIGHT MODE ---
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('fd_theme', isLight ? 'light' : 'dark');
            document.getElementById('themeToggle').innerText = isLight ? '☀️' : '🌙';
        }
        // Load theme on start
        if (localStorage.getItem('fd_theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').innerText = '☀️';
        }

        // --- 2. AUTO-DETECT LINK ---
        function autoDetect(url) {
            if (!url) return;
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                if (currentMode !== 'youtube') switchTab('youtube');
            } else if (url.includes('tiktok.com')) {
                if (currentMode !== 'tiktok') switchTab('tiktok');
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabYt').classList.toggle('active', mode === 'youtube');
            document.getElementById('tabTt').classList.toggle('active', mode === 'tiktok');
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function pasteClipboard() {
            try { 
                const text = await navigator.clipboard.readText(); 
                document.getElementById('urlInput').value = text; 
                autoDetect(text); // Trigger auto detect saat paste
            } catch (err) { alert("Gagal akses clipboard. Paste manual (Ctrl+V)."); }
        }

        // --- 3. STATISTIK HARIAN ---
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('dailyCount').innerText = data.todayDownloads;
            } catch(e) {}
        }
        setInterval(fetchStats, 5000); // Update tiap 5 detik
        fetchStats();

        // --- 4. RIWAYAT DOWNLOAD (LOCALSTORAGE) ---
        function saveToHistory(title, link, type) {
            let history = JSON.parse(localStorage.getItem('fd_history') || '[]');
            history.unshift({ title, link, type, time: new Date().toLocaleTimeString() });
            if (history.length > 5) history.pop(); // Maksimal 5
            localStorage.setItem('fd_history', JSON.stringify(history));
            renderHistory();
        }
        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('fd_history') || '[]');
            const list = document.getElementById('historyList');
            const section = document.getElementById('historySection');
            list.innerHTML = '';
            if (history.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            history.forEach(item => {
                list.innerHTML += `<li class="history-item"><span>[${item.time}] ${item.title.substring(0,25)}...</span> <a href="${item.link}" target="_blank">⬇</a></li>`;
            });
        }
        function clearHistory() { localStorage.removeItem('fd_history'); renderHistory(); }
        renderHistory(); // Load on start

        // --- PROGRESS BAR ---
        function simulateProgress() {
            const container = document.getElementById('progressContainer'); const bar = document.getElementById('progressBar'); const text = document.getElementById('progressText');
            container.style.display = 'block'; text.style.display = 'block'; bar.style.width = '0%';
            let width = 0; const stages = ["Menganalisis link...", "AI Membersihkan Judul...", "Mengekstrak media...", "Hampir selesai..."]; let stageIdx = 0;
            const interval = setInterval(() => {
                if (width >= 90) { clearInterval(interval); return; }
                width += Math.random() * 15; if(width > 90) width = 90; bar.style.width = width + '%';
                if(width > 25 && stageIdx === 0) { text.innerText = stages[1]; stageIdx++; }
                if(width > 55 && stageIdx === 1) { text.innerText = stages[2]; stageIdx++; }
                if(width > 80 && stageIdx === 2) { text.innerText = stages[3]; stageIdx++; }
            }, 300);
            window.currentProgressInterval = interval;
        }
        function finishProgress(success) {
            clearInterval(window.currentProgressInterval); const bar = document.getElementById('progressBar'); const text = document.getElementById('progressText'); const container = document.getElementById('progressContainer');
            bar.style.width = '100%'; text.innerText = success ? "✅ Berhasil!" : "❌ Gagal.";
            setTimeout(() => { container.style.display = 'none'; text.style.display = 'none'; bar.style.width = '0%'; }, 1500);
        }

        // --- 5. PROCESS DOWNLOAD (Dengan AI Cleaner & History) ---
        async function processDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('actionBtn'); const errorMsg = document.getElementById('errorMsg'); const resultArea = document.getElementById('resultArea');
            if (!url) { showError("Link tidak boleh kosong, Murid!"); return; }
            
            btn.disabled = true; btn.innerText = "⏳ Memproses..."; errorMsg.style.display = 'none'; resultArea.style.display = 'none';
            simulateProgress();

            try {
                const endpoint = currentMode === 'youtube' ? '/api/download/youtube' : '/api/download/tiktok';
                
                if (currentMode === 'tiktok') {
                    // Minta format JSON dulu biar bisa simpan ke history & dapat judul bersih
                    const response = await fetch(`${endpoint}?url=${encodeURIComponent(url)}&format=json`);
                    const contentType = response.headers.get("content-type");
                    
                    if (contentType && contentType.includes("application/json")) {
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || "Server error.");
                        
                        document.getElementById('resTitle').innerText = data.title;
                        document.getElementById('resThumb').src = data.thumb || 'https://via.placeholder.com/60/333/fff?text=FD';
                        // Link save tetap mengarah ke endpoint streaming langsung
                        const streamLink = `${endpoint}?url=${encodeURIComponent(url)}`;
                        document.getElementById('resLink').href = streamLink;
                        resultArea.style.display = 'block';
                        
                        saveToHistory(data.title, streamLink, 'TikTok');
                    } else {
                        // Fallback kalau server langsung stream
                        const streamLink = `${endpoint}?url=${encodeURIComponent(url)}`;
                        window.location.href = streamLink;
                        document.getElementById('resTitle').innerText = "TikTok Video (Direct)";
                        document.getElementById('resLink').href = streamLink;
                        resultArea.style.display = 'block';
                        saveToHistory("TikTok Video", streamLink, 'TikTok');
                    }
                } else {
                    const response = await fetch(`${endpoint}?url=${encodeURIComponent(url)}`);
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Server error.");
                    
                    document.getElementById('resTitle').innerText = data.title;
                    document.getElementById('resThumb').src = data.thumb || 'https://via.placeholder.com/60/333/fff?text=FD';
                    document.getElementById('resLink').href = data.link;
                    resultArea.style.display = 'block';
                    
                    saveToHistory(data.title, data.link, 'YouTube');
                }
                
                fetchStats(); // Refresh angka statistik
                finishProgress(true);
            } catch (err) {
                showError(err.message); finishProgress(false);
            } finally {
                btn.disabled = false; btn.innerText = "🚀 Unduh Sekarang";
            }
        }
        function showError(msg) { const errorMsg = document.getElementById('errorMsg'); errorMsg.innerText = "❌ " + msg; errorMsg.style.display = 'block'; }

        // --- 6. PWA INSTALL PROMPT ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('installPrompt').style.display = 'flex';
        });
        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('installPrompt').style.display = 'none';
            deferredPrompt = null;
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
