<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FD Downloader - YouTube, TikTok, SoundCloud</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="description" content="Download MP3 YouTube, Video TikTok, dan SoundCloud secara gratis. Cepat, mudah, tanpa iklan.">
    <meta name="keywords" content="youtube downloader, tiktok downloader, soundcloud downloader, download mp3, download video">
    <meta name="author" content="FACHRI DEV">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://riihdyt.devs.surf/">
    <meta property="og:title" content="FD Downloader - YouTube, TikTok, SoundCloud">
    <meta property="og:description" content="Download MP3 YouTube, Video TikTok, dan SoundCloud secara gratis. Cepat, mudah, tanpa iklan.">
    <meta property="og:image" content="https://riihdyt.devs.surf/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://riihdyt.devs.surf/">
    <meta name="twitter:title" content="FD Downloader - YouTube, TikTok, SoundCloud">
    <meta name="twitter:description" content="Download MP3 YouTube, Video TikTok, dan SoundCloud secara gratis.">
    <meta name="twitter:image" content="https://riihdyt.devs.surf/logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: rgba(255,255,255,0.04);
            --card-border: rgba(255,255,255,0.08);
            --text: #f0f0f5;
            --muted: #71717a;
            --primary: #6366f1;
            --primary-glow: rgba(99,102,241,0.25);
            --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
            --input: rgba(255,255,255,0.06);
            --input-border: rgba(255,255,255,0.1);
            --radius: 14px;
        }
        body.light {
            --bg: #f5f5f7;
            --card: rgba(255,255,255,0.85);
            --card-border: rgba(0,0,0,0.06);
            --text: #18181b;
            --muted: #71717a;
            --primary: #4f46e5;
            --primary-glow: rgba(79,70,229,0.15);
            --input: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { width: 350px; height: 350px; background: rgba(99,102,241,0.08); top: -100px; left: -80px; }
        body::after { width: 300px; height: 300px; background: rgba(139,92,246,0.06); bottom: -100px; right: -80px; }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 20px;
            position: relative;
            z-index: 1;
            animation: fadeIn .4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
        }
        .brand-text h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .brand-text span {
            font-size: 10px;
            color: var(--muted);
        }
        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: var(--input);
            border: 1px solid var(--input-border);
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 14px;
        }
        .tab {
            flex: 1;
            padding: 8px 4px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .tab.on {
            background: var(--grad);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .input-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 70px 12px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--input-border);
            background: var(--input);
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .input-wrap input::placeholder { color: var(--muted); opacity: .6; }
        .btn-paste {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input);
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }
        .btn-paste:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .btn-go {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--grad);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: transform .15s, box-shadow .2s;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-go:hover { transform: translateY(-1px); box-shadow: 0 10px 28px var(--primary-glow); }
        .btn-go:active { transform: scale(.97); }
        .btn-go:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .progress {
            height: 4px;
            background: var(--input);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--grad);
            border-radius: 4px;
            transition: width .3s;
        }
        .progress-text {
            font-size: 10px;
            color: var(--primary);
            margin-top: 6px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .error {
            font-size: 11px;
            color: #f43f5e;
            background: rgba(244,63,94,0.08);
            border: 1px solid rgba(244,63,94,0.15);
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        .preview {
            display: none;
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--input-border);
            position: relative;
            animation: fadeIn .3s ease;
        }
        .preview img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: var(--input);
        }
        .preview .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 99px;
        }
        .preview .badge.ok { background: var(--grad); }
        .preview .hint {
            font-size: 10px;
            color: var(--muted);
            padding: 6px 10px;
        }

        .result {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: var(--input);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            animation: fadeIn .3s ease;
        }
        .result-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-row img {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--input);
            border: 1px solid var(--input-border);
        }
        .result-row .info { flex: 1; min-width: 0; }
        .result-row .label { font-size: 9px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; }
        .result-row .title {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn-save {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: var(--grad);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            transition: transform .15s;
            font-family: inherit;
        }
        .btn-save:hover { transform: translateY(-1px); }

        .sc-list {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
        }
        .sc-item {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px;
            background: var(--input);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            animation: fadeIn .3s ease;
        }
        .sc-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--input); }
        .sc-item .sc-info { flex: 1; min-width: 0; }
        .sc-item .sc-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sc-item .sc-sub { font-size: 9px; color: var(--muted); margin-top: 1px; }
        .sc-item button {
            background: var(--grad);
            border: none;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            font-family: inherit;
        }

        .footer {
            text-align: center;
            margin-top: 14px;
            font-size: 10px;
            color: var(--muted);
            opacity: .5;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--muted);
            background: var(--input);
            border: 1px solid var(--input-border);
            padding: 5px 12px;
            border-radius: 8px;
        }
        .stats-bar strong {
            color: var(--primary);
            font-weight: 700;
        }

        #installPrompt {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 100;
            font-size: 12px;
            font-weight: 600;
            animation: fadeIn .3s ease;
        }
        #installPrompt button {
            background: var(--grad);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
        }
        #installPrompt .close {
            background: transparent;
            color: var(--muted);
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
    </style>
</head>
<body>

<div id="installPrompt">
    <span>Install FD App?</span>
    <button id="btnInstall">Install</button>
    <button class="close" onclick="this.parentElement.style.display='none'">&times;</button>
</div>

<div class="card">
        <div class="top-bar">
        <div class="brand">
            <img src="/logo.png" alt="FD Logo" class="brand-icon">
            <div class="brand-text">
                <h1>Media Downloader</h1>
                <span>YouTube &middot; TikTok &middot; SoundCloud</span>
            </div>
        </div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="stats-bar">
        <span>Unduhan Hari Ini: <strong id="dailyCount">0</strong></span>
    </div>

    <div class="tabs">
        <button class="tab on" id="tabYt" onclick="switchTab('youtube')">YouTube</button>
        <button class="tab" id="tabTt" onclick="switchTab('tiktok')">TikTok</button>
        <button class="tab" id="tabSc" onclick="switchTab('soundcloud')">SoundCloud</button>
    </div>

    <div class="input-wrap">
        <input type="text" id="urlInput" placeholder="Paste link atau ketik judul..." oninput="autoDetect(this.value)">
        <button class="btn-paste" onclick="pasteClipboard()">Paste</button>
    </div>

    <button class="btn-go" id="actionBtn" onclick="processDownload()">Download</button>

    <div class="progress" id="progressBox"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"></div>
    <div class="error" id="errorMsg"></div>

    <div class="preview" id="previewArea">
        <img src="" alt="" id="previewThumb">
        <span class="badge" id="previewBadge"></span>
        <div class="hint" id="previewHint"></div>
    </div>

    <div class="result" id="resultArea">
        <div class="result-row">
            <img src="" alt="" id="resThumb">
            <div class="info">
                <div class="label">HASIL</div>
                <div class="title" id="resTitle">-</div>
            </div>
        </div>
        <a href="#" class="btn-save" id="resLink" target="_blank">Download File</a>
    </div>

    <div class="sc-list" id="scResults"></div>

    <div class="footer">FACHRI DEV &middot; &copy; <span id="year"></span> &middot; v3.1.0</div>
</div>

<script>
let currentMode = 'youtube';

function toggleTheme() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    localStorage.setItem('fd_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
}
if (localStorage.getItem('fd_theme') === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeBtn').innerText = '☀️';
}

function extractYouTubeId(url) {
    const m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/) || url.match(/^([a-zA-Z0-9_-]{11})$/);
    return m ? m[1] : null;
}

function showYouTubePreview(url) {
    const id = extractYouTubeId(url);
    const area = document.getElementById('previewArea');
    if (!id) { area.style.display = 'none'; return; }
    document.getElementById('previewThumb').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    const badge = document.getElementById('previewBadge');
    badge.textContent = 'YouTube';
    badge.classList.add('ok');
    document.getElementById('previewHint').textContent = 'Thumbnail ditemukan';
    area.style.display = 'block';
}

function hidePreview() { document.getElementById('previewArea').style.display = 'none'; }

async function showSoundcloudPreview(url) {
    const area = document.getElementById('previewArea');
    const badge = document.getElementById('previewBadge');
    const hint = document.getElementById('previewHint');
    area.style.display = 'block';
    document.getElementById('previewThumb').src = '';
    badge.textContent = 'Memuat...';
    badge.classList.remove('ok');
    hint.textContent = 'Mengambil info dari SoundCloud...';
    try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch(`/api/download/soundcloud/info?url=${encodeURIComponent(url)}`, { signal: ctrl.signal });
        clearTimeout(tid);
        const data = await res.json();
        if (!data.success) throw new Error();
        document.getElementById('previewThumb').src = data.thumb || '';
        badge.textContent = 'SoundCloud';
        badge.classList.add('ok');
        hint.textContent = data.title;
    } catch (e) {
        if (e.name === 'AbortError') { badge.textContent = 'Timeout'; hint.textContent = 'Gagal memuat.'; }
        else area.style.display = 'none';
    }
}

function autoDetect(url) {
    if (!url) { hidePreview(); return; }
    if (url.includes('youtube.com') || url.includes('youtu.be')) {
        if (currentMode !== 'youtube') switchTab('youtube');
        showYouTubePreview(url);
    } else if (url.includes('tiktok.com')) {
        if (currentMode !== 'tiktok') switchTab('tiktok');
        hidePreview();
    } else if (url.includes('soundcloud.com')) {
        if (currentMode !== 'soundcloud') switchTab('soundcloud');
        showSoundcloudPreview(url);
    } else { hidePreview(); }
}

function switchTab(mode) {
    currentMode = mode;
    document.getElementById('tabYt').classList.toggle('on', mode === 'youtube');
    document.getElementById('tabTt').classList.toggle('on', mode === 'tiktok');
    document.getElementById('tabSc').classList.toggle('on', mode === 'soundcloud');
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('scResults').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';
    hidePreview();
    const inp = document.getElementById('urlInput');
    inp.placeholder = mode === 'soundcloud' ? 'Ketik judul lagu atau paste link...' : 'Paste link YouTube / TikTok...';
}

async function pasteClipboard() {
    try {
        const t = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = t;
        autoDetect(t);
    } catch (e) { alert('Gagal akses clipboard. Paste manual (Ctrl+V).'); }
}

function simulateProgress() {
    const box = document.getElementById('progressBox');
    const bar = document.getElementById('progressBar');
    const txt = document.getElementById('progressText');
    box.style.display = 'block';
    txt.style.display = 'block';
    bar.style.width = '0%';
    let w = 0;
    const msgs = ['Menganalisis...', 'Mengekstrak...', 'Hampir selesai...'];
    let mi = 0;
    window._prog = setInterval(() => {
        if (w >= 90) { clearInterval(window._prog); return; }
        w += Math.random() * 15;
        if (w > 90) w = 90;
        bar.style.width = w + '%';
        if (w > 30 && mi === 0) { txt.textContent = msgs[1]; mi++; }
        if (w > 60 && mi === 1) { txt.textContent = msgs[2]; mi++; }
    }, 300);
}

function finishProgress(ok) {
    clearInterval(window._prog);
    const bar = document.getElementById('progressBar');
    const txt = document.getElementById('progressText');
    const box = document.getElementById('progressBox');
    bar.style.width = '100%';
    txt.textContent = ok ? 'Berhasil!' : 'Gagal.';
    setTimeout(() => { box.style.display = 'none'; txt.style.display = 'none'; bar.style.width = '0%'; }, 1200);
}

function showError(msg) {
    const e = document.getElementById('errorMsg');
    e.textContent = msg;
    e.style.display = 'block';
}

async function processDownload() {
    const url = document.getElementById('urlInput').value.trim();
    const btn = document.getElementById('actionBtn');
    const err = document.getElementById('errorMsg');
    const res = document.getElementById('resultArea');
    if (!url) { showError('Link tidak boleh kosong!'); return; }
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    err.style.display = 'none';
    res.style.display = 'none';
    simulateProgress();
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 30000);
    try {
        const ep = currentMode === 'youtube' ? '/api/download/youtube' : '/api/download/tiktok';
        if (currentMode === 'soundcloud') {
            if (url.includes('soundcloud.com')) {
                const link = `/api/download/soundcloud?url=${encodeURIComponent(url)}`;
                document.getElementById('resTitle').textContent = 'SoundCloud MP3';
                document.getElementById('resThumb').src = document.getElementById('previewThumb').src || '';
                document.getElementById('resLink').href = link;
                res.style.display = 'block';
                finishProgress(true);
                window.location.href = link;
            } else {
                const r = await fetch(`/api/download/soundcloud/search?q=${encodeURIComponent(url)}`, { signal: ctrl.signal });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || 'Server error');
                renderSc(d.tracks);
                if (!d.tracks.length) throw new Error('Tidak ada hasil.');
                finishProgress(true);
            }
        } else if (currentMode === 'tiktok') {
            const r = await fetch(`${ep}?url=${encodeURIComponent(url)}&format=json`, { signal: ctrl.signal });
            const ct = r.headers.get('content-type');
            if (ct && ct.includes('json')) {
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || 'Server error');
                document.getElementById('resTitle').textContent = d.title;
                document.getElementById('resThumb').src = d.thumb || '';
                const sl = `${ep}?url=${encodeURIComponent(url)}`;
                document.getElementById('resLink').href = sl;
                res.style.display = 'block';
                finishProgress(true);
            } else {
                window.location.href = `${ep}?url=${encodeURIComponent(url)}`;
                finishProgress(true);
            }
        } else {
            const r = await fetch(`${ep}?url=${encodeURIComponent(url)}`, { signal: ctrl.signal });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Server error');
            document.getElementById('resTitle').textContent = d.title;
            document.getElementById('resThumb').src = d.thumb || '';
            document.getElementById('resLink').href = d.link;
            res.style.display = 'block';
            finishProgress(true);
        }
    } catch (e) {
        showError(e.name === 'AbortError' ? 'Timeout. Coba lagi.' : e.message);
        finishProgress(false);
    } finally {
        clearTimeout(tid);
        btn.disabled = false;
        btn.textContent = 'Download';
    }
}

function renderSc(tracks) {
    const c = document.getElementById('scResults');
    c.innerHTML = '';
    tracks.forEach(t => {
        const m = Math.floor(t.duration / 60000);
        const s = Math.floor((t.duration % 60000) / 1000);
        const dur = t.duration ? `${m}:${String(s).padStart(2, '0')}` : '';
        c.innerHTML += `<div class="sc-item">
            <img src="${t.thumb || ''}" onerror="this.style.display='none'">
            <div class="sc-info">
                <div class="sc-title">${t.title}</div>
                <div class="sc-sub">${dur ? dur + ' · ' : ''}SoundCloud</div>
            </div>
            <button onclick="dlSc('${encodeURIComponent(t.permalink)}')">MP3</button>
        </div>`;
    });
    c.style.display = 'flex';
}

function dlSc(p) {
    const link = '/api/download/soundcloud?url=' + p;
    window.location.href = link;
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; document.getElementById('installPrompt').style.display = 'flex'; });
document.getElementById('btnInstall').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') document.getElementById('installPrompt').style.display = 'none';
    deferredPrompt = null;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

document.getElementById('year').textContent = new Date().getFullYear();

async function fetchStats() {
    try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('dailyCount').textContent = data.todayDownloads;
    } catch(e) {}
}
setInterval(fetchStats, 5000);
fetchStats();
</script>
</body>
</html>
